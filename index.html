<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Theme bootstrap. Runs during head parse, before anything paints, and
         applies the same resolution `initializeTheme()` in src/store/appStore.ts
         uses: stored preference first, then the OS setting.

         Two reasons this has to be inline rather than left to the bundle.
         First, prerendered pages ship with whatever class the build-time
         browser resolved baked onto <html>, so without this a visitor whose
         preference differs paints the wrong theme until the bundle boots.
         Second, appStore's `setTheme` is a no-op when the resolved theme
         already equals the store's default ('light'), so it would never strip
         a baked-in `class="dark"` for a light-mode visitor at all. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.className = stored || (prefersDark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.className = 'light';
        }
      })();
    </script>

    <!-- Critical inline CSS to prevent FOUC on the static hero. Without this,
         html/body briefly paint white and the workspace photo renders at its
         natural 1672px size in the page flow before globals.css loads and
         confines it to the right-hand panel. These rules apply immediately
         during HTML parse; full styling lives in the `.studio-hero` block of
         src/styles/globals.css. -->
    <style>
      html, body { background: #060a10; }
      .studio-hero { background: #0a0f18; position: relative; overflow: hidden; }
      /* Theme bootstrap above has already written .light/.dark onto <html>,
         so the correct ground paints on the very first frame instead of
         flashing navy at light-theme visitors. #fff matches the light
         theme's --background, so nothing shifts when globals.css lands. */
      html.light, html.light body { background: #ffffff; }
      html.light .studio-hero { background: #faf6ef; }
      .studio-hero__media { position: absolute; inset: 0 0 0 auto; width: 62%; }
      .studio-hero__img { display: block; width: 100%; height: 100%; object-fit: cover; }
      /* Kill default <a> styling on the hero CTAs so they don't briefly
         render as blue underlined links during the FOUC window. */
      .studio-hero__cta a { color: inherit; text-decoration: none; }
      @media (max-width: 767px) {
        .studio-hero__media { position: relative; inset: auto; width: 100%; height: 18rem; }
      }
    </style>

    <!-- Default title + description. Individual pages override these via
         react-helmet-async, but Google needs values for any route that
         hasn't mounted its <Helmet> yet (and for the social crawlers
         that fetch the static HTML). -->
    <title data-rh="true">BrightPath Web Studio — Front-End Developer & Web Designer</title>
    <meta data-rh="true" name="description" content="BrightPath Web Studio is the portfolio of Tisha Di Fresco — front-end developer and designer specializing in modern responsive websites, performance optimization, and custom React + WordPress builds." />
    <meta name="author" content="Tisha Di Fresco" />
    <meta name="keywords" content="front-end developer, web designer, React developer, WordPress developer, Divi, performance optimization, responsive design, portfolio" />
    <link data-rh="true" rel="canonical" href="https://brightpathwebstudio.org/" />

    <!-- Self-hosted fonts (declared via @font-face in globals.css).
         Preload Lato Regular — used by every block of body text — so it
         lands during initial HTML parse instead of waiting for the CSS
         to be discovered and parsed. The other three weights load on
         demand. -->
    <link
      rel="preload"
      href="/fonts/lato-v25-latin-regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Open Graph (Facebook, LinkedIn)

         `data-rh="true"` on a tag hands ownership of it to react-helmet-async:
         on mount, Helmet removes every `meta[data-rh]` it doesn't itself emit
         and appends its own. Without the attribute the tag is invisible to
         Helmet, so a prerendered page ends up with the generic default *and*
         the route-specific value — two og:description tags, two canonicals.

         Tag exactly the ones PageMeta always emits. og:type, og:site_name and
         twitter:card stay untagged because PageMeta never sets them — marking
         them would let Helmet delete them on every route. -->
    <meta data-rh="true" property="og:title" content="BrightPath Web Studio — Front-End Developer & Web Designer" />
    <meta data-rh="true" property="og:description" content="Portfolio of Tisha Di Fresco — front-end developer specializing in modern responsive websites, performance optimization, and custom React + WordPress builds." />
    <meta data-rh="true" property="og:image" content="https://brightpathwebstudio.org/social-preview.png" />
    <meta data-rh="true" property="og:url" content="https://brightpathwebstudio.org" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BrightPath Web Studio" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta data-rh="true" name="twitter:title" content="BrightPath Web Studio — Front-End Developer & Web Designer" />
    <meta data-rh="true" name="twitter:description" content="Portfolio of Tisha Di Fresco — front-end developer specializing in modern responsive websites, performance optimization, and custom React + WordPress builds." />
    <meta data-rh="true" name="twitter:image" content="https://brightpathwebstudio.org/social-preview.png" />

    <!-- Structured Data (JSON-LD) — tells Google about the business itself -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "BrightPath Web Studio",
      "url": "https://brightpathwebstudio.org",
      "logo": "https://brightpathwebstudio.org/images/brightpath-logo-light.png",
      "telephone": "+1-704-453-3973",
      "email": "tishdifresco@brightpathstudio.com",
      "founder": {
        "@type": "Person",
        "name": "Tisha Di Fresco"
      },
      "description": "Front-end web development and design studio specializing in modern responsive websites, performance optimization, and custom React + WordPress builds.",
      "address": {
        "@type": "PostalAddress",
        "addressRegion": "NC",
        "addressCountry": "US"
      },
      "areaServed": "United States",
      "contactPoint": [
        {
          "@type": "ContactPoint",
          "contactType": "customer service",
          "telephone": "+1-704-453-3973",
          "email": "tishdifresco@brightpathstudio.com",
          "areaServed": "US"
        }
      ],
      "knowsAbout": [
        "Front-End Development",
        "React",
        "TypeScript",
        "WordPress",
        "Divi",
        "Web Performance Optimization",
        "Responsive Web Design",
        "User Experience Design"
      ]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "BrightPath Web Studio",
      "url": "https://brightpathwebstudio.org"
    }
    </script>
  </head>
  <body>
    <!-- Static homepage hero injected at build time by the
         brightpath-inject-static-hero plugin (see vite.config.ts).
         Lives BEFORE #root so the LCP text paints before React boots. -->
    <!-- HERO_PLACEHOLDER -->

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
