<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Critical inline CSS to prevent FOUC on the static hero. Without this,
         html/body briefly paint white and the lighthouse silhouette renders
         at its natural SVG size in the page flow (huge, centered) before
         globals.css loads and snaps it to absolute corner positioning with
         opacity 0. These three rules apply immediately during HTML parse. -->
    <style>
      html, body { background: #060a10; }
      .hero-clarity { background: #060a10; }
      .lighthouse-silhouette { position: absolute; opacity: 0; }
      /* Kill default <a> styling on the hero CTAs so they don't briefly
         render as blue underlined links on the left edge during the FOUC
         window before Tailwind classes apply. */
      .clarity-cta a { color: inherit; text-decoration: none; }
    </style>

    <!-- Default title + description. Individual pages override these via
         react-helmet-async, but Google needs values for any route that
         hasn't mounted its <Helmet> yet (and for the social crawlers
         that fetch the static HTML). -->
    <title>BrightPath Web Studio — Front-End Developer & Web Designer</title>
    <meta name="description" content="BrightPath Web Studio is the portfolio of Tisha Di Fresco — front-end developer and designer specializing in modern responsive websites, performance optimization, and custom React + WordPress builds." />
    <meta name="author" content="Tisha Di Fresco" />
    <meta name="keywords" content="front-end developer, web designer, React developer, WordPress developer, Divi, performance optimization, responsive design, portfolio" />
    <link rel="canonical" href="https://brightpathwebstudio.org/" />

    <!-- Self-hosted fonts (declared via @font-face in globals.css).
         Preload Lato Regular — used by every block of body text — so it
         lands during initial HTML parse instead of waiting for the CSS
         to be discovered and parsed. The other three weights load on
         demand. -->
    <link
      rel="preload"
      href="/fonts/lato-v25-latin-regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Open Graph (Facebook, LinkedIn) -->
    <meta property="og:title" content="BrightPath Web Studio — Front-End Developer & Web Designer" />
    <meta property="og:description" content="Portfolio of Tisha Di Fresco — front-end developer specializing in modern responsive websites, performance optimization, and custom React + WordPress builds." />
    <meta property="og:image" content="https://brightpathwebstudio.org/social-preview.png" />
    <meta property="og:url" content="https://brightpathwebstudio.org" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BrightPath Web Studio" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BrightPath Web Studio — Front-End Developer & Web Designer" />
    <meta name="twitter:description" content="Portfolio of Tisha Di Fresco — front-end developer specializing in modern responsive websites, performance optimization, and custom React + WordPress builds." />
    <meta name="twitter:image" content="https://brightpathwebstudio.org/social-preview.jpg" />

    <!-- Structured Data (JSON-LD) — tells Google about the business itself -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "BrightPath Web Studio",
      "url": "https://brightpathwebstudio.org",
      "logo": "https://brightpathwebstudio.org/images/brightpath-logo-light.png",
      "telephone": "+1-704-453-3973",
      "email": "tishdifresco@brightpathstudio.com",
      "founder": {
        "@type": "Person",
        "name": "Tisha Di Fresco"
      },
      "description": "Front-end web development and design studio specializing in modern responsive websites, performance optimization, and custom React + WordPress builds.",
      "address": {
        "@type": "PostalAddress",
        "addressRegion": "NC",
        "addressCountry": "US"
      },
      "areaServed": "United States",
      "contactPoint": [
        {
          "@type": "ContactPoint",
          "contactType": "customer service",
          "telephone": "+1-704-453-3973",
          "email": "tishdifresco@brightpathstudio.com",
          "areaServed": "US"
        }
      ],
      "knowsAbout": [
        "Front-End Development",
        "React",
        "TypeScript",
        "WordPress",
        "Divi",
        "Web Performance Optimization",
        "Responsive Web Design",
        "User Experience Design"
      ]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "BrightPath Web Studio",
      "url": "https://brightpathwebstudio.org"
    }
    </script>
  </head>
  <body>
    <!-- Static homepage hero injected at build time by the
         brightpath-inject-static-hero plugin (see vite.config.ts).
         Lives BEFORE #root so the LCP text paints before React boots. -->
    <!-- HERO_PLACEHOLDER -->

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
