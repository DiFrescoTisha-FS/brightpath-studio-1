[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/phases"
  to = "/.netlify/functions/phases"
  status = 200

[[redirects]]
  from = "/api/reviews"
  to = "/.netlify/functions/reviews"
  status = 200

[[redirects]]
  from = "/api/submit-contact-form"
  to = "/.netlify/functions/submit-contact-form"
  status = 200

[[redirects]]
  from = "/api/case-studies"
  to = "/.netlify/functions/get-case-studies"
  status = 200

# SPA fallback for every route without its own prerendered HTML — /services
# and /reviews (both load live data from the functions above), plus any
# unknown URL. app.html is a copy of the built shell with an empty #root,
# taken before the prerenderer overwrites index.html with the rendered
# homepage; falling back to index.html would serve homepage content on those
# routes and break hydration. Static files still win over this rule, so the
# prerendered /about/index.html and friends are served directly.
[[redirects]]
  from = "/*"
  to = "/app.html"
  status = 200

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  framework = "vite"
