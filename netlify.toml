# Netlify Configuration
# This file configures build settings and serverless functions for Netlify deployment

[build]
  # Build command for the Vite frontend
  command = "npm run build"
  # Directory where the built files are output
  publish = "dist"
  # Directory containing serverless functions
  functions = "netlify/functions"

[functions]
  # Use esbuild for faster function bundling
  node_bundler = "esbuild"
  # Include external modules that need to be bundled
  included_files = ["netlify/functions/**"]

# Redirect API calls to serverless functions
[[redirects]]
  from = "/api/phases"
  to = "/.netlify/functions/phases"
  status = 200

[[redirects]]
  from = "/api/reviews"
  to = "/.netlify/functions/reviews"
  status = 200

[[redirects]]
  from = "/api/submit-contact-form"
  to = "/.netlify/functions/submit-contact-form"
  status = 200

# SPA fallback - redirect all routes to index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security and caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
