[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Where Puppeteer keeps Chrome for Testing, used by the prerender step in
  # vite.config.ts. /opt/build/cache is Netlify's build cache, restored between
  # deploys, so the ~150 MB browser is downloaded once rather than every build.
  # If the cache is cold the build just re-downloads it — nothing breaks.
  PUPPETEER_CACHE_DIR = "/opt/build/cache/puppeteer"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/phases"
  to = "/.netlify/functions/phases"
  status = 200

[[redirects]]
  from = "/api/reviews"
  to = "/.netlify/functions/reviews"
  status = 200

[[redirects]]
  from = "/api/submit-contact-form"
  to = "/.netlify/functions/submit-contact-form"
  status = 200

[[redirects]]
  from = "/api/case-studies"
  to = "/.netlify/functions/get-case-studies"
  status = 200

[[redirects]]
  from = "/api/newsletter-subscribe"
  to = "/.netlify/functions/newsletter-subscribe"
  status = 200

[[redirects]]
  from = "/api/contact-inquiry"
  to = "/.netlify/functions/contact-inquiry"
  status = 200

# Legacy Reviews address. The route was renamed review → reviews in Jan 2026,
# but the mobile menu kept linking to /review until Nov 2026, so the old URL
# may be bookmarked or shared. Permanent redirect, `force = true` so no file
# can shadow it. Netlify matches /review/ with the same rule. Must stay above
# the /* SPA fallback.
[[redirects]]
  from = "/review"
  to = "/reviews"
  status = 301
  force = true

# SPA fallback for every route without its own prerendered HTML — /services
# and /reviews (both load live data from the functions above), plus any
# unknown URL. app.html is a copy of the built shell with an empty #root,
# taken before the prerenderer overwrites index.html with the rendered
# homepage; falling back to index.html would serve homepage content on those
# routes and break hydration. Static files still win over this rule, so the
# prerendered /about/index.html and friends are served directly.
[[redirects]]
  from = "/*"
  to = "/app.html"
  status = 200

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  framework = "vite"
